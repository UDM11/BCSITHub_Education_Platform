    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">BCSITHub - Complete Educational Platform for Pokhara University BCSIT Students</h1>

    <script>
      // ---------------------------------------------------------------
      // DYNAMIC CANONICAL URL — fixes Google "duplicate canonical" issue
      // Runs immediately, before React mounts, so crawlers see it early
      // ---------------------------------------------------------------
      (function () {
        var BASE = 'https://bcsithubs.web.app';
        function setCanonical() {
          var tag = document.getElementById('canonical-tag');
          if (tag) {
            // Use pathname only (no query string or hash) for canonical
            var path = window.location.pathname.replace(/\/$/, '') || '/';
            tag.setAttribute('href', BASE + path);
          }
        }
        // Set immediately on load
        setCanonical();
        // Update on every SPA navigation
        var origPush = history.pushState;
        history.pushState = function () { origPush.apply(history, arguments); setCanonical(); };
        var origReplace = history.replaceState;
        history.replaceState = function () { origReplace.apply(history, arguments); setCanonical(); };
        window.addEventListener('popstate', setCanonical);
      })();

      // Cleanly fade out and remove the splash screen once the app is loaded
      window.addEventListener('DOMContentLoaded', function () {
        var splash = document.getElementById('pwa-splash');
        if (splash) {
          setTimeout(function () {
            splash.style.opacity = '0';
            setTimeout(function () { splash.remove(); }, 500);
          }, 350);
        }
      });
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        options: { skipHtmlTags: ['script', 'noscript', 'style'] }
      };
    </script>
